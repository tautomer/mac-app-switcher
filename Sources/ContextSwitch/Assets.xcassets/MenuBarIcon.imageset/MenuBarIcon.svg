    </g>
    <path d="M9 14.74 L9 9.82 C9 7.36 13.1 7.36 13.1 4.08" stroke-width="1.9" stroke-linejoin="round"/>
  </g>
  <circle cx="13.1" cy="4.08" r="1.8" fill="#000000"/>
</svg>
