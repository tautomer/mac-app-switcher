name: Release

# Builds ContextSwitch.app and attaches a zip to a GitHub Release whenever a
# version tag (v1.2.3) is pushed, once the unit tests (ci.yml) pass. Run it
# manually (Actions ▸ Release ▸ Run workflow) to get the zip as a build
# artifact only.
#
# How the app is signed depends on which repository secrets exist
# (Settings ▸ Secrets and variables ▸ Actions):
#
# 1. developer-id — signed and notarized; opens on any Mac without warnings.
#    Needs a paid Apple Developer Program membership.
#      DEVELOPER_ID_P12_BASE64    base64 of the "Developer ID Application"
#                                 certificate + private key, exported as .p12
#      DEVELOPER_ID_P12_PASSWORD  the .p12's password
#      APPLE_TEAM_ID              10-character Team ID
#      ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
#                                 App Store Connect API key, used by notarytool
#
# 2. self-signed — free. Signed with your own certificate, so a Mac keeps the
#    permissions it granted (e.g. Location) across updates. Not notarized.
#      SELF_SIGNED_P12_BASE64     base64 of a .p12 whose certificate is named
#                                 "ContextSwitch Self-Signed"
#      SELF_SIGNED_P12_PASSWORD   the .p12's password
#
# 3. adhoc — no secrets at all. Permissions are asked for again after updates.
#
# Builds from 2 and 3 aren't notarized: on other Macs the first launch is
# blocked until it's allowed in System Settings ▸ Privacy & Security ▸
# "Open Anyway".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SELF_SIGNED_IDENTITY: ContextSwitch Self-Signed

jobs:
  # The CI workflow's tests. Nothing is signed or published unless they pass.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Actions are pinned to commit SHAs (tags can be moved), since this job
      # handles the signing secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Decide version and signing mode
        id: plan
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          SELF_SIGNED_P12: ${{ secrets.SELF_SIGNED_P12_BASE64 }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$DEVELOPER_ID_P12" ]]; then
            MODE=developer-id
          elif [[ -n "$SELF_SIGNED_P12" ]]; then
            MODE=self-signed
            echo "::notice::Signing with the self-signed certificate; the app won't be notarized."
          else
            MODE=adhoc
            echo "::warning::No signing secrets — building an ad-hoc signed, un-notarized app."
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.plan.outputs.mode != 'adhoc'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SELF_SIGNED_P12: ${{ secrets.SELF_SIGNED_P12_BASE64 }}
          SELF_SIGNED_P12_PASSWORD: ${{ secrets.SELF_SIGNED_P12_PASSWORD }}
        run: |
          if [[ "$MODE" == developer-id ]]; then
            P12="$DEVELOPER_ID_P12"; P12_PASSWORD="$DEVELOPER_ID_P12_PASSWORD"
          else
            P12="$SELF_SIGNED_P12"; P12_PASSWORD="$SELF_SIGNED_P12_PASSWORD"
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Put the temporary keychain on the search list so codesign finds it.
          EXISTING=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"   # trim leading spaces
            EXISTING+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          # Self-signed identities are listed as "not trusted"; codesign uses them anyway.
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Archive
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          case "$MODE" in
            developer-id)
              SIGNING=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application" "DEVELOPMENT_TEAM=$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp) ;;
            self-signed)
              SIGNING=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=$SELF_SIGNED_IDENTITY") ;;
            *)
              SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=-) ;;
          esac
          VERSIONING=()
          if [[ -n "$VERSION" ]]; then
            VERSIONING=("MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER")
          fi
          # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO keeps Xcode's debugging
          # entitlement (get-task-allow) out — notarization rejects it.
          xcodebuild archive \
            -project ContextSwitch.xcodeproj -scheme ContextSwitch -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ContextSwitch.xcarchive" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO "${SIGNING[@]}" "${VERSIONING[@]}"

      - name: Export app
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXPORT="$RUNNER_TEMP/export"
          if [[ "$MODE" == developer-id ]]; then
            OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
            plutil -create xml1 "$OPTIONS"
            plutil -insert method -string developer-id "$OPTIONS"
            plutil -insert teamID -string "$TEAM_ID" "$OPTIONS"
            plutil -insert signingStyle -string manual "$OPTIONS"
            plutil -insert signingCertificate -string "Developer ID Application" "$OPTIONS"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/ContextSwitch.xcarchive" \
              -exportOptionsPlist "$OPTIONS" -exportPath "$EXPORT"
          else
            # Already signed as needed by the archive step.
            mkdir -p "$EXPORT"
            cp -R "$RUNNER_TEMP/ContextSwitch.xcarchive/Products/Applications/ContextSwitch.app" "$EXPORT/"
          fi
          codesign --verify --deep --strict --verbose=2 "$EXPORT/ContextSwitch.app"
          codesign --display --requirements - --verbose=2 "$EXPORT/ContextSwitch.app"

      - name: Notarize and staple
        if: steps.plan.outputs.mode == 'developer-id'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          APP="$RUNNER_TEMP/export/ContextSwitch.app"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | plutil -extract status raw -o - -)
          if [[ "$STATUS" != Accepted ]]; then
            ID=$(echo "$RESULT" | plutil -extract id raw -o - -)
            xcrun notarytool log "$ID" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            rm "$KEY"
            exit 1
          fi
          rm "$KEY"
          xcrun stapler staple "$APP"
          # The same check Gatekeeper makes on a user's Mac.
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package
        id: package
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          NAME="ContextSwitch-${VERSION:-$(git rev-parse --short HEAD)}"
          if [[ "$MODE" != developer-id ]]; then NAME="$NAME-unnotarized"; fi
          ZIP="$RUNNER_TEMP/$NAME.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/ContextSwitch.app" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ContextSwitch
          path: ${{ steps.package.outputs.zip }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          NOTES=""
          if [[ "$MODE" != developer-id ]]; then
            NOTES="⚠️ This build is not notarized. After the first launch attempt, allow it in System Settings ▸ Privacy & Security ▸ Open Anyway."
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "ContextSwitch $GITHUB_REF_NAME" --notes "$NOTES" --generate-notes

      - name: Remove temporary keychain
        if: always() && steps.plan.outputs.mode != 'adhoc'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
