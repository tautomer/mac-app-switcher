name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Release runs these tests before it builds anything.
  workflow_call:

# github.workflow is the caller's name when Release calls this, so a manual
# Release run on master doesn't cancel (or get cancelled by) a push's CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Toolchain
        run: xcodebuild -version

      # The same script used locally: regenerates the project from
      # project.yml, runs the unit tests, then makes a Release build.
      - name: Test and build
        run: scripts/build.sh --test
